name: Aggiorna notizie
on: {schedule: [{cron: '*/15 * * * *'}], push: {paths: [feeds.json]}, workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: aggiorna, cancel-in-progress: false}
jobs: {aggiorna: {runs-on: ubuntu-latest, steps: [{uses: 'actions/checkout@v4'}, {name: Scarica i feed, run: python3 fetch_feeds.py}, {name: Salva le novità, run: 'git config user.name github-actions && git config user.email github-actions@users.noreply.github.com && git add news.json && (git diff --staged --quiet || (git commit -m "Aggiorna notizie" && git push))'}]}}
